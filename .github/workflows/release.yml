# Builds OrcaAudioCleanup for Mac on GitHub's Apple silicon runners: runs the Swift tests, builds the
# app and the disk image (unsigned: ad hoc signature, no notarization), and keeps them as a workflow
# artifact. Pushing a tag v<version> (matching pyproject.toml) also uploads the image to that tag's
# GitHub release. Running it by hand from the Actions tab builds and tests without publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # build-app.sh numbers the build by the commit count.
          fetch-depth: 0
      # The uv that the app bundles, so pinned.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.11.16'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Toolchain
        run: |
          swift --version
          uv --version
      # For release.sh's engine smoke checks.
      - name: Engine
        run: uv sync --frozen

      - name: Version and tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $version"
            exit 1
          fi

      # Swift tests, engine smoke checks, then OrcaAudioCleanup.app and the disk image in dist/.
      - name: Test and build
        run: app/scripts/release.sh

      - name: Publish
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v$VERSION
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --verify-tag --title "OrcaAudioCleanup $VERSION" --generate-notes
          gh release upload "$tag" "dist/OrcaAudioCleanup-$VERSION.dmg" dist/OrcaAudioCleanup.dmg dist/SHA256SUMS --clobber

      - name: Keep the image
        uses: actions/upload-artifact@v7
        with:
          name: OrcaAudioCleanup
          if-no-files-found: error
          path: |
            dist/OrcaAudioCleanup-*.dmg
            dist/SHA256SUMS
